onboarding = false

[keys]
prefix = "ctrl+a"

[theme]
name = "catppuccin"

[theme.custom]
surface_dim = "#45475a"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace", "tab"],
  ["agent", "state_text"],
  ["terminal_title_stripped"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$agent_session", dim = true }],
]

[ui.toast]
delay_seconds = 1
delivery = "terminal"

[session]
resume_agents_on_restore = true
