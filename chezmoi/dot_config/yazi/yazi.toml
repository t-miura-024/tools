[mgr]
show_hidden = true

[preview]
max_width = 1000
max_height = 1000

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- mdcat --no-pager --columns=$w --theme catppuccin-mocha "$1"'

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
